name: Continuous Integration

# Runs the test suite. It builds real answer sheets with the PDF generator,
# reads them back with OpenCV, and drives the grading API in-process, so it
# catches layout drift and scoring changes. It deploys nothing.

on:
  push:
    branches: [master]
    paths-ignore:
      - 'site/**'
      - '**.md'
      - '.github/workflows/deploy_site.yml'
  pull_request:
    paths-ignore:
      - 'site/**'
      - '**.md'
      - '.github/workflows/deploy_site.yml'
  workflow_dispatch:

# One run per branch. Pushing again supersedes the run already queued rather
# than stacking another set of jobs behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Without this a job that cannot get a runner sits in the queue for the
    # six-hour default, holding a concurrency slot the whole time.
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Spelled out rather than a full cross product: Windows 3.13 is where
        # this is actually run, Linux 3.13 is what the Modal image uses, and
        # Linux 3.12 covers the lower bound the dependency ranges allow.
        include:
          - os: windows-latest
            python-version: '3.13'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: ubuntu-latest
            python-version: '3.12'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The tests render the answer sheet and read it back with OpenCV, which
      # on a bare Linux runner needs the shared libraries the manylinux wheel
      # links against.
      - name: Install OpenCV runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - run: python -m pytest -q
