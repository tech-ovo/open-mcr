name: Continuous Integration

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # The two interpreters the project is verified against. The
        # dependency ranges nominally allow 3.10 and 3.11 as well, but those
        # are not exercised here.
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The tests render the answer sheet and read it back with OpenCV, which
      # on a bare Linux runner needs the shared libraries the manylinux wheel
      # links against.
      - name: Install OpenCV runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - run: python -m pytest -q
