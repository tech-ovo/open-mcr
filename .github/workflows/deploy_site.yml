name: Deploy Site

# Publishes site/ to GitHub Pages. There is no build step: the page is plain
# HTML, CSS and JavaScript, so "building" means copying the folder and dropping
# in the Apps Script file, which is authored in tools/ and served next to the
# page so step 7 can link to it.
#
# To use a custom domain (grade.uhsjcl.org, say), set a repository variable
# named SITE_DOMAIN to that host and point a CNAME record at
# <owner>.github.io. Leave the variable unset to publish at the default
# github.io address.

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'tools/Sheet.gs'
      - '.github/workflows/deploy_site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Without this a job that cannot get a runner sits in the queue for the
    # six-hour default, holding its concurrency slot the whole time.
    timeout-minutes: 10
    # Deliberately NOT the shared "pages" group used by the deploy job below.
    # A build queued in that group blocks every later run in it, including a
    # manual one - which is how a single stuck job takes the whole workflow
    # down. Here a newer push simply supersedes an older build.
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp tools/Sheet.gs _site/Sheet.gs

      - name: Set the custom domain
        if: vars.SITE_DOMAIN != ''
        run: echo "${{ vars.SITE_DOMAIN }}" > _site/CNAME

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only the publish itself is serialised, and it is never cancelled midway:
    # a half-applied Pages deployment is worse than a slow one.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
